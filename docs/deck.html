<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Surftober Award Ceremony</title>
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
  <link rel="stylesheet" href="./deck.css">
  <script>
    // Stale-page guard: each deploy renames the scripts, so a cached old copy of
    // this page asks for files that are gone and never starts. If the page's
    // script hasn't flagged itself started within 8 s, reload once from a fresh
    // address (at most once a minute, so it can't loop).
    (function () {
      var KEY = 'surftober.freshReload';
      setTimeout(function () {
        if (window.__surftoberPageStarted) return;
        var last = 0;
        try { last = Number(sessionStorage.getItem(KEY) || 0); } catch (e) { /* private mode */ }
        if (Date.now() - last < 60000) return;
        try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) { /* private mode */ }
        var u = new URL(location.href);
        u.searchParams.set('fresh', String(Date.now()));
        location.replace(u.toString());
      }, 8000);
    })();
  </script>
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="stage" id="stage">
      <div class="loading"><img src="./logo.svg" alt=""><div>Paddling out for the season's data…</div></div>
    </div>
  </div>
  <nav class="overview" id="overview" aria-label="All slides"></nav>
  <div class="keys" id="keys" role="note">
    <kbd>→</kbd>/<kbd>Space</kbd>/click next (reveals first) · <kbd>←</kbd> back · <kbd>G</kbd> grid (then <kbd>A</kbd> arrange) · <kbd>F</kbd> fullscreen · <kbd>T</kbd> light/dark · <kbd>Enter</kbd> open/close the book · <kbd>L</kbd> reload data · <kbd>Esc</kbd> close
  </div>
  <script src="./awards.js"></script>
  <script src="./deck-config.js"></script>
  <script src="./deck-stats.js"></script>
  <script src="./game.js"></script>
  <script src="./deck.js"></script>
</body>
</html>
