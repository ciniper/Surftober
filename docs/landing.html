<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surftober 2026</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="apple-touch-icon" href="./logo.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="theme-color" content="#fff8f0" />
  <script>
  // Theme follows the app (v1.55.0): LIGHT by default, dark only when the
  // visitor's saved app theme (header toggle / admin picker) is a dark one.
  // Runs before first paint so there is no flash. Names mirror THEMES in
  // app.js; an unknown name falls back to light there too.
  (function () {
    var DARK = { 'sunset-surf': 1, 'sunset-ember': 1, 'sunset-soft': 1, 'board-wax': 1,
                 'night-swell': 1, 'dusk-patrol': 1, 'high-tide': 1, 'golden-hour': 1,
                 'dawn-patrol': 1, 'deep-kelp': 1, 'midnight-set': 1, 'neon-beach': 1 };
    var dark = false;
    try {
      var sel = JSON.parse(localStorage.getItem('surftober.theme.v1') || 'null');
      if (sel && sel.name === 'custom') {
        var m = /^#([0-9a-f]{6})$/i.exec(String((sel.vars && sel.vars.bg) || ''));
        if (m) {
          var n = parseInt(m[1], 16);
          dark = (0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) < 128;
        }
      } else if (sel && DARK[sel.name]) {
        dark = true;
      }
    } catch (e) {}
    if (dark) {
      document.documentElement.classList.add('dark');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', '#152238');
    }
  })();
  </script>
  <style>
    /* Palette: Pumpkin Spice (the app's light default) / Sunset Surf (dark),
       switched by html.dark from the script above. */
    :root {
      --lp-bg-a: #f5f0e8; --lp-bg-b: #fbe9d9;
      --lp-card: #fff8f0; --lp-card-shadow: rgba(45, 36, 22, 0.16);
      --lp-title: #b54a17; --lp-title-glow: none;
      --lp-sub: #6f5d46;
      --lp-primary-a: #d1470f; --lp-primary-b: #c2410c;
      --lp-secondary: #e8dcc8; --lp-secondary-hover: #dfd0b8; --lp-secondary-text: #2d2416;
      --lp-border: #d4c4a8;
      --lp-ghost-text: #6f5d46; --lp-ghost-hover-border: #2d8659;
    }
    html.dark {
      --lp-bg-a: #0a1628; --lp-bg-b: #152238;
      --lp-card: #152238; --lp-card-shadow: rgba(0, 0, 0, 0.5);
      --lp-title: #ff6b35; --lp-title-glow: 0 0 20px rgba(255, 107, 53, 0.3);
      --lp-sub: #7a9bb5;
      --lp-primary-a: #ff6b35; --lp-primary-b: #ff4500;
      --lp-secondary: #1e3a52; --lp-secondary-hover: #243b54; --lp-secondary-text: #e8f4f8;
      --lp-border: #2d4a62;
      --lp-ghost-text: #7a9bb5; --lp-ghost-hover-border: #4ecdc4;
    }
    html { background: var(--lp-bg-a); }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .landing-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, var(--lp-bg-a) 0%, var(--lp-bg-b) 100%);
    }
    .landing-card {
      background: var(--lp-card);
      border-radius: 12px;
      padding: 3rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px var(--lp-card-shadow);
      text-align: center;
      border: 2px solid #ff6b35;
    }
    .landing-logo {
      width: 104px;
      height: 104px;
      display: block;
      margin: 0 auto 0.75rem;
      filter: drop-shadow(0 8px 22px rgba(255, 107, 53, 0.28));
    }
    .landing-title {
      font-size: 3rem;
      margin: 0 0 0.5rem 0;
      color: var(--lp-title);
      text-shadow: var(--lp-title-glow);
    }
    .landing-subtitle {
      font-size: 1.5rem;
      color: var(--lp-sub);
      margin: 0 0 2rem 0;
    }
    .landing-buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .landing-btn {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s ease;
      text-decoration: none;
      display: block;
    }
    .landing-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
    }
    .btn-register {
      background: linear-gradient(135deg, var(--lp-primary-a) 0%, var(--lp-primary-b) 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
    }
    .btn-signin {
      background: var(--lp-secondary);
      color: var(--lp-secondary-text);
      border: 2px solid var(--lp-border);
    }
    .btn-signin:hover {
      background: var(--lp-secondary-hover);
      border-color: #ff6b35;
    }
    .btn-view {
      background: transparent;
      color: var(--lp-ghost-text);
      border: 2px solid var(--lp-border);
    }
    .btn-view:hover {
      background: var(--lp-secondary);
      color: var(--lp-secondary-text);
      border-color: var(--lp-ghost-hover-border);
    }
    /* styles.css derives .app-version from the app's LIGHT theme vars, which
       is right for the light landing; on the dark landing pin it readable. */
    html.dark .app-version { color: #7a9bb5; }
  </style>
</head>
<body>
  <div class="landing-container">
    <div class="landing-card">
      <img class="landing-logo" src="./logo.svg" alt="" aria-hidden="true" width="104" height="104" />
      <div class="landing-title">Surftober</div>
      <div class="landing-subtitle">2026</div>
      <div class="landing-buttons">
        <a href="./register.html" class="landing-btn btn-register">Register for Surftober</a>
        <a href="./index.html?mode=signin" class="landing-btn btn-signin" onclick="sessionStorage.setItem('surftober_authenticated', '1')">Sign In</a>
        <a href="./index.html?mode=view" id="btn-view-mode" class="landing-btn btn-view">View Mode (Read Only)</a>
      </div>
      <div class="app-version" style="margin-top:1.5rem;"></div>
    </div>
  </div>
  <script src="./version.js"></script>
  <script>
    // Club gate for View Mode — a friends-only speed bump, not real security
    // (the password lives in the WhatsApp group).
    document.getElementById('btn-view-mode').addEventListener('click', function (e) {
      if (localStorage.getItem('surftober.clubpass') === '1') {
        sessionStorage.setItem('surftober_authenticated', '1');
        return;
      }
      e.preventDefault();
      var guess = (prompt('Club password?') || '').trim().toLowerCase().replace(/\s+/g, ' ');
      if (!guess) return;
      if (guess === 'snowy plover') {
        localStorage.setItem('surftober.clubpass', '1');
        sessionStorage.setItem('surftober_authenticated', '1');
        window.location.href = this.href;
      } else {
        alert('Not quite — ask the crew about the bird 🐦');
      }
    });
    // Sign In keeps its pass-through flag (no password — existing accounts)
    document.querySelector('a[href*="mode=signin"]').addEventListener('click', function () {
      sessionStorage.setItem('surftober_authenticated', '1');
    });
  </script>

  <!-- Vercel Web Analytics: cookieless page-view counts. The shim queues calls
       until the deferred script loads. Served by Vercel at /_vercel/insights/*
       (404s harmlessly on localhost and on the GitHub Pages fallback). The
       service worker skips /_vercel/ entirely so beacons are never cached. -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
