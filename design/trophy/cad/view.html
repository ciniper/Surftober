<!doctype html>
<meta charset="utf-8">
<title>Surftober trophy — generated STL check</title>
<style>
  body{margin:0;font:14px system-ui,sans-serif;background:#f3ece2;color:#2d2416}
  #ui{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:#fff8f0;border-bottom:1px solid #e3d6c0}
  select,button{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid #d4c4a8;background:#fff}
  button.on{background:#ff6b35;color:#fff;border-color:#ff6b35}
  #cap{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;font-size:12px;color:#6f5d46;background:#fff8f0cc}
  a{color:#b54a17}
</style>
<div id="ui">
  <b>Generated STLs</b>
  <select id="set"></select>
  <span id="parts"></span>
  <button id="explode">Exploded</button>
  <button id="wire">Wireframe</button>
  <a href="../index.html" style="margin-left:auto">← previews</a>
</div>
<div id="cap">Files from <code>./out/</code> (run <code>spinner.py</code> to make them). Parts are shown in their mounted positions; the STLs themselves are saved in print orientation.</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const COLORS = { body: 0xe9e1cf, 'wave-water': 0x1d3050, 'wave-foam': 0xefe7d2, hub: 0x1d3050, 'hub-text': 0xd4af37, 'back-cap': 0xff6b35 };
const T = 7, HUB_Z0 = 0.6 + 2.4, CAP_Z0 = 0.8 + 3.0;
// STLs are in print orientation; put them back where they sit on the bearing (body z 0..7)
const PLACE = {
  body: (m, tag) => { if (/-cog/.test(tag)) m.position.z = -2.3; }, 'wave-water': m => {}, 'wave-foam': m => {},   // cog bodies are saved standing on their boss
  hub: m => { m.rotation.x = Math.PI; m.position.z = T + HUB_Z0; }, 'hub-text': m => { m.rotation.x = Math.PI; m.position.z = T + HUB_Z0; },
  'back-cap': m => { m.position.z = -CAP_Z0; },
};
const EXPLODE = { body: 0, 'wave-water': 10, 'wave-foam': 14, hub: 30, 'hub-text': 36, 'back-cap': -22 };

const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf3ece2);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 2000); camera.position.set(60, -120, 150); camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1;
scene.add(new THREE.HemisphereLight(0xffffff, 0xcbb9a0, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 2); key.position.set(80, -120, 200); key.castShadow = true; scene.add(key);
const group = new THREE.Group(); scene.add(group);
let exploded = false, wire = false, meshes = [];

async function listSets() {
  const html = await (await fetch('./out/')).text();
  const names = [...html.matchAll(/href="([^"]+\.stl)"/g)].map(m => decodeURIComponent(m[1]));
  const sets = {};
  for (const n of names) { const m = n.match(/^(.*)-(body|wave-water|wave-foam|hub|hub-text|back-cap)\.stl$/); if (m) (sets[m[1]] ||= []).push(m[2]); }
  return sets;
}
function load(tag, parts) {
  group.clear(); meshes = [];
  document.getElementById('parts').textContent = parts.join(' · ');
  const loader = new STLLoader();
  parts.forEach(p => loader.load(`./out/${tag}-${p}.stl`, geo => {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: COLORS[p] ?? 0x888888, roughness: p === 'hub-text' ? 0.35 : 0.7, metalness: p === 'hub-text' ? 0.7 : 0, wireframe: wire }));
    m.castShadow = m.receiveShadow = true; PLACE[p]?.(m, tag); m.userData = { z0: m.position.z, part: p }; group.add(m); meshes.push(m);
  }));
}
const sets = await listSets(), sel = document.getElementById('set');
Object.keys(sets).sort().forEach(k => sel.add(new Option(k, k)));
const want = new URLSearchParams(location.search).get('set');
if (want && sets[want]) sel.value = want;
if (sel.value) load(sel.value, sets[sel.value]); else document.getElementById('parts').textContent = 'no STLs in ./out/ yet';
sel.addEventListener('change', () => { load(sel.value, sets[sel.value]); history.replaceState(null, '', `?set=${sel.value}`); });
document.getElementById('explode').addEventListener('click', e => { exploded = !exploded; e.target.classList.toggle('on', exploded); });
document.getElementById('wire').addEventListener('click', e => { wire = !wire; e.target.classList.toggle('on', wire); meshes.forEach(m => m.material.wireframe = wire); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__view = { group, meshes: () => meshes, setExploded: v => { exploded = v; }, stop: () => { controls.autoRotate = false; } };
(function loop() { requestAnimationFrame(loop); controls.update(); meshes.forEach(m => { const want = m.userData.z0 + (exploded ? EXPLODE[m.userData.part] : 0); m.position.z += (want - m.position.z) * 0.1; }); renderer.render(scene, camera); })();
</script>
