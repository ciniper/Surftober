<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surftober 2026 — spinner trophy mockup</title>
<style>
  html,body{margin:0;height:100%;background:#f3ece2;font-family:system-ui,-apple-system,sans-serif;color:#2d2416}
  #ui{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}
  button,select{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid #d4c4a8;background:#fff8f0;cursor:pointer;white-space:nowrap}
  button.on{background:#d1470f;color:#fff;border-color:#d1470f}
  #cap{position:fixed;left:10px;bottom:10px;right:10px;font-size:13px;color:#6f5d46;background:rgba(255,248,240,.85);padding:8px 10px;border-radius:8px}
  canvas{display:block}
</style>
</head>
<body>
<div id="ui">
  <select id="tier"><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option><option value="participant">Participant</option></select>
  <span id="spinOpts" style="display:none">
    <select id="capc" title="Cap anodize colour"><option value="orange">Cap: orange</option><option value="navy">Cap: navy</option><option value="teal">Cap: teal</option></select>
    <button id="explode">Exploded</button>
    <button id="fridge">On fridge</button>
    <button id="bodyspin" class="on">Spin body</button>
    <select id="ringm" title="Ring shape"><option value="wave">Ring: disk + wave</option><option value="disk">Ring: disk</option><option value="notched">Ring: notched</option></select>
    <select id="wavev" title="Wave animation style"></select>
    <select id="bodym" title="What spins"><option value="stock">Body: stock spinner + ring</option><option value="printed">Body: printed disc + bearing</option><option value="metal">Body: metal disc + bearing</option><option value="spoked">Body: printed ring on arms</option></select>
    <select id="armsn" title="Arms carrying the ring (ring-on-arms body only)"><option value="3">3 arms</option><option value="4">4 arms</option></select>
    <select id="textm" title="Where the text goes"><option value="ring">Text: on the ring (spins)</option><option value="hub">Text: on a still hub</option></select>
    <button id="phonecam">Phone-cam demo</button>
  </span>
  <button id="spin" class="on">Auto-rotate</button>
  <button id="png">Download PNG</button>
</div>
<div id="cap"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { WAVE_VARIANTS, WAVE_DEFAULT, ringArt } from './wave-frames.js';

const NAME = new URLSearchParams(location.search).get('name') || 'NAHLA';
const TIERS = {
  gold:        { color: 0xd4af37, metal: 0.8, rough: 0.3, label: 'Gold (40 h)', ring: 'GOLD' },
  silver:      { color: 0xc8ccd2, metal: 0.85, rough: 0.25,  label: 'Silver (30 h)', ring: 'SILVER' },
  bronze:      { color: 0xb87333, metal: 0.8, rough: 0.35,  label: 'Bronze (20 h)', ring: 'BRONZE' },
  participant: { color: 0x3fa98f, metal: 0.2, rough: 0.6,  label: 'Participant (10 h)', ring: 'PARTICIPANT' },
};
const CAPTIONS = {
  spinner:  'C · Spinner magnet — a 608 bearing with an anodized magnet cap on the back (the N42 magnet sits on the inner race, so it never spins; only that cap touches the fridge). Body: stock tri-spinner + printed ring with rods through the lobe inserts, a printed disc with 12 M6 nuts sealed inside for weight, or a laser-cut metal disc (brass / stainless / copper = tier) on a printed hub. Text: on the spinning face, or on a still hub that replaces the front cap so it stays readable while spinning. Ring: disk + breaking wave (Phone-cam demo, or wave-demo.html), plain disk, or notched. Dimensions are placeholders.',
};

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3ece2);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 2000);
camera.position.set(140, 110, 190);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 25, 0); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xffffff, 0xcbb9a0, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(120, 200, 140); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -150; key.shadow.camera.right = 150; key.shadow.camera.top = 150; key.shadow.camera.bottom = -150;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffe7d0, 0.6); fill.position.set(-150, 80, -60); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const M = {
  wood:  () => new THREE.MeshStandardMaterial({ color: 0xc9a66b, roughness: 0.85 }),
  wood2: () => new THREE.MeshStandardMaterial({ color: 0xa67c48, roughness: 0.85 }),
  navy:  () => new THREE.MeshStandardMaterial({ color: 0x1d3050, roughness: 0.5 }),
  orange:() => new THREE.MeshStandardMaterial({ color: 0xff6b35, roughness: 0.5 }),
  cream: () => new THREE.MeshStandardMaterial({ color: 0xefe7d2, roughness: 0.7 }),
  teal:  () => new THREE.MeshStandardMaterial({ color: 0x3aa9a3, roughness: 0.6 }),
  sand:  () => new THREE.MeshStandardMaterial({ color: 0xb89b70, roughness: 0.9 }),
  ink:   () => new THREE.MeshStandardMaterial({ color: 0x16273d, roughness: 0.6 }),
  magnet:() => new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.6 }),
  tier:  (t) => new THREE.MeshStandardMaterial({ color: TIERS[t].color, metalness: TIERS[t].metal, roughness: TIERS[t].rough }),
};

let font = null;
function text(str, size, depth, mat, opts = {}) {
  const g = new TextGeometry(str, { font, size, height: depth, curveSegments: 6, bevelEnabled: false });
  g.computeBoundingBox(); const bb = g.getSize ? null : g.boundingBox;
  const w = g.boundingBox.max.x - g.boundingBox.min.x, h = g.boundingBox.max.y - g.boundingBox.min.y;
  g.translate(-w / 2 - g.boundingBox.min.x, -h / 2 - g.boundingBox.min.y, 0);
  const m = new THREE.Mesh(g, mat); m.castShadow = true; return m;
}
function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w/2 + r, -h/2); s.lineTo(w/2 - r, -h/2); s.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r);
  s.lineTo(w/2, h/2 - r); s.quadraticCurveTo(w/2, h/2, w/2 - r, h/2); s.lineTo(-w/2 + r, h/2);
  s.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r); s.lineTo(-w/2, -h/2 + r); s.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);
  return s;
}
function slab(shape, depth, mat, holes) {
  if (holes) holes.forEach(h => shape.holes.push(h));
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false }), mat);
  m.castShadow = true; m.receiveShadow = true; return m;
}
// Flat "logo medallion": navy disc, orange ring, sand dune, teal water, cream bird blob + sun
function medallion(r, depth) {
  const g = new THREE.Group();
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(r, r, depth, 48), M.navy()); disc.castShadow = true; g.add(disc);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r - 1.2, 1.3, 12, 64), M.orange()); ring.rotation.x = Math.PI / 2; ring.position.y = depth / 2; g.add(ring);
  const sun = new THREE.Mesh(new THREE.CylinderGeometry(r * .28, r * .28, 0.8, 32), M.orange()); sun.position.set(r * .22, depth / 2 + .4, -r * .2); g.add(sun);
  const dune = new THREE.Mesh(new THREE.CylinderGeometry(r * .78, r * .78, 0.8, 48, 1, false, Math.PI * 1.15, Math.PI * .7), M.sand()); dune.position.y = depth / 2 + .4; g.add(dune);
  const water = new THREE.Mesh(new THREE.CylinderGeometry(r * .78, r * .78, 0.9, 48, 1, false, Math.PI * 1.3, Math.PI * .4), M.teal()); water.position.y = depth / 2 + .45; g.add(water);
  const bird = new THREE.Mesh(new THREE.SphereGeometry(r * .3, 24, 16), M.cream()); bird.scale.set(1.3, 0.35, 0.8); bird.position.set(-r * .05, depth / 2 + .9, -r * .02); g.add(bird);
  const head = new THREE.Mesh(new THREE.SphereGeometry(r * .15, 20, 14), M.cream()); head.scale.set(1, 0.4, 1); head.position.set(-r * .33, depth / 2 + 1.0, -r * .1); g.add(head);
  return g;
}

const SP = {
  d: 25, R: 13.5, waist: 14.5, hole: 11, t: 7,       // lobe-centre distance, lobe radius, narrowest web, hole radius (Ø22), body thickness
  capR: 9, capT: 3, spacerR: 5.5, spacerT: 0.8,      // Ø18 cap (14–20 range), spacer touches the inner race only
  magR: 5, magT: 2, pocketR: 5.1,                    // Ø10×2 N42 disc, pocket +0.2 on Ø for a glue fit
  insertHole: 4,                                     // lobe weight insert: Ø22 OD press fit, Ø8 through-hole (guess — measure)
  ringOut: 40, ringWaist: 30, ringIn: 17,            // wide printed ring: r 40 over the lobes (covers the rods), dips to r 30 between them as finger notches for flicking
  ringT: 2.4, textT: 0.6,                            // ring thickness, embossed second-colour text
  hubR: 16, hubT: 2.4,                               // still front hub that carries the text (replaces the front cap)
  nutR: 5.55, nutT: 5, nutOrbit: 33, nuts: 12,       // printed disc: 12 M6 hex nuts (~2.5 g each) sealed in at mid-thickness for spin weight
  discT: 2,                                          // metal disc thickness
  waveIn: 30.6, waveOut: 39.4,                       // breaking-wave band on the disk ring (frames in wave-frames.js)
  rodR: 3.85, rodLen: 6.8,                           // Ø7.7 rods, full length through the insert, 0.2 short of the back face
  spokeHubOut: 16, spokeRingIn: 27.5, armW: 9,       // ring-on-arms body: printed hub on the 608, arms out to the wave ring
  wideHubR: 25.5,                                    // still front hub wide enough to hide the arms (leaves a 2 mm reveal before the ring)
};
const CAP_COLORS = { orange: 0xff6b35, navy: 0x1d3050, teal: 0x3aa9a3 };
let capColor = 'orange', exploded = false, onFridge = false, bodySpin = true, phoneCam = false;
let ringMode = new URLSearchParams(location.search).get('ring') || 'wave'; // wave | disk | notched
let bodyMode = new URLSearchParams(location.search).get('body') || 'stock';   // stock | printed | metal
let textMode = new URLSearchParams(location.search).get('text') || 'ring';    // ring | hub
let armsN = +new URLSearchParams(location.search).get('arms') || 3;          // 3 | 4, ring-on-arms body only
let waveVariant = WAVE_VARIANTS[new URLSearchParams(location.search).get('wave')] ? new URLSearchParams(location.search).get('wave') : WAVE_DEFAULT;
let waveN = +new URLSearchParams(location.search).get('frames') || WAVE_VARIANTS[waveVariant].N;

function zcyl(r, z0, h, mat, seg = 48) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat);
  m.rotation.x = Math.PI / 2; m.position.z = z0 + h / 2; m.castShadow = true; m.receiveShadow = true; return m;
}
// Disc or washer extruded along +z from 0 to depth, with an optional rounded edge.
function annulus(rOut, rIn, depth, mat, bevel = 0) {
  const s = new THREE.Shape(); s.absarc(0, 0, rOut, 0, Math.PI * 2, false);
  if (rIn > 0) { const h = new THREE.Path(); h.absarc(0, 0, rIn, 0, Math.PI * 2, true); s.holes.push(h); }
  const geo = new THREE.ExtrudeGeometry(s, bevel
    ? { depth: depth - 2 * bevel, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelOffset: -bevel, bevelSegments: 2, curveSegments: 64 }
    : { depth, bevelEnabled: false, curveSegments: 64 });
  if (bevel) geo.translate(0, 0, bevel);
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m;
}
// Classic tri-spinner outline: three lobe arcs joined by concave fillets sized so
// the narrowest point between lobes is SP.waist from the centre; four Ø22 holes.
function spinnerBodyShape() {
  const { d, R, waist, hole } = SP;
  const f = (waist * waist + d * d - waist * d - R * R) / (2 * R + d - 2 * waist), q = waist + f;
  const P = i => { const a = Math.PI / 2 + i * 2 * Math.PI / 3; return [d * Math.cos(a), d * Math.sin(a)]; };
  const Q = i => { const a = Math.PI / 2 + i * 2 * Math.PI / 3 + Math.PI / 3; return [q * Math.cos(a), q * Math.sin(a)]; }; // fillet between lobes i and i+1
  const ang = (from, to) => Math.atan2(to[1] - from[1], to[0] - from[0]);
  const s = new THREE.Shape();
  for (let i = 0; i < 3; i++) {
    const p = P(i), pNext = P((i + 1) % 3), qPrev = Q((i + 2) % 3), qNext = Q(i);
    s.absarc(p[0], p[1], R, ang(p, qPrev), ang(p, qNext), false);
    s.absarc(qNext[0], qNext[1], f, ang(qNext, p), ang(qNext, pNext), true);
  }
  [[0, 0], P(0), P(1), P(2)].forEach(([x, y]) => { const h = new THREE.Path(); h.absarc(x, y, hole, 0, Math.PI * 2, true); s.holes.push(h); });
  return { shape: s, P };
}
// Text bent around a circle. top=true reads clockwise over the top, false reads
// counter-clockwise along the bottom; both stay upright.
function arcText(str, r, size, depth, mat, top) {
  const g = new THREE.Group(), scale = size / font.data.resolution, track = size * 0.08, chars = [...str];
  const adv = chars.map(ch => (ch === '·' ? size * 0.7 : font.data.glyphs[ch] ? font.data.glyphs[ch].ha * scale : size * 0.6) + track);
  let s = -(adv.reduce((a, b) => a + b, 0) - track) / 2;
  chars.forEach((ch, i) => {
    const mid = s + adv[i] / 2; s += adv[i];
    if (ch === ' ') return;
    let m;
    if (ch === '·') m = zcyl(size * 0.12, 0, depth, mat, 16);
    else {
      const geo = new TextGeometry(ch, { font, size, height: depth, curveSegments: 4, bevelEnabled: false });
      geo.computeBoundingBox(); geo.translate(-(geo.boundingBox.min.x + geo.boundingBox.max.x) / 2, -size * 0.36, 0);
      m = new THREE.Mesh(geo, mat); m.castShadow = true;
    }
    const th = top ? Math.PI / 2 - mid / r : -Math.PI / 2 + mid / r;
    const w = new THREE.Group(); w.add(m);
    w.position.set(r * Math.cos(th), r * Math.sin(th), 0); w.rotation.z = top ? th - Math.PI / 2 : th + Math.PI / 2;
    g.add(w);
  });
  return g;
}
// Same cap part front and back; the back one gets the magnet pocket. Local +z points away from the body.
function buildCap(withMagnet, parts) {
  const cap = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: CAP_COLORS[capColor], metalness: 0.65, roughness: 0.32 }); // anodized 6061
  cap.add(zcyl(3.95, -3.3, 3.3, mat, 32));                     // stem into the 8 mm bore
  cap.add(zcyl(SP.spacerR, 0, SP.spacerT, mat));               // spacer lands on the stationary inner race
  const disc = annulus(SP.capR, withMagnet ? SP.pocketR : 0, SP.capT, mat, 0.5); disc.position.z = SP.spacerT; cap.add(disc);
  if (withMagnet) {
    const floorT = SP.capT - SP.magT - 0.1;                     // magnet sits 0.1 below the face
    cap.add(zcyl(SP.pocketR, SP.spacerT, floorT, mat));
    const magnet = zcyl(SP.magR, SP.spacerT + floorT, SP.magT, M.magnet()); cap.add(magnet);
    parts.push({ obj: magnet, z0: magnet.position.z, dz: 12 });
  }
  return cap;
}
// Ring outline follows the arms: r = mid + amp·cos(3φ) peaks over each lobe and
// curves in between them, so there's still an edge to flick.
function trefoilRing(mat, rIn = SP.ringIn, depth = SP.ringT) {
  const mid = (SP.ringOut + SP.ringWaist) / 2, amp = (SP.ringOut - SP.ringWaist) / 2, N = 240;
  const pts = [];
  for (let i = 0; i < N; i++) { const th = i / N * Math.PI * 2, r = mid + amp * Math.cos(3 * (th - Math.PI / 2)); pts.push(new THREE.Vector2(r * Math.cos(th), r * Math.sin(th))); }
  const s = new THREE.Shape(pts);
  const h = new THREE.Path(); h.absarc(0, 0, rIn, 0, Math.PI * 2, true); s.holes.push(h);
  const geo = new THREE.ExtrudeGeometry(s, { depth: depth - 0.8, bevelEnabled: true, bevelThickness: 0.4, bevelSize: 0.4, bevelOffset: -0.4, bevelSegments: 2, curveSegments: 64 });
  geo.translate(0, 0, 0.4);
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m;
}
// Disk or notched outline (per the Ring selector), extruded from z 0 to depth.
const outline = (mat, rIn, depth) => ringMode === 'notched' ? trefoilRing(mat, rIn, depth) : annulus(SP.ringOut, rIn, depth, mat, Math.min(0.4, depth / 4));
// Metal disc finish per tier: brass, stainless, copper, anodized aluminium.
const METAL = { gold: [0xd9b85c, 0.8, 0.4], silver: [0xe2e5e9, 0.8, 0.34], bronze: [0xc98250, 0.8, 0.42], participant: [0x3fa98f, 0.55, 0.38] }; // brushed
const metalMat = t => new THREE.MeshStandardMaterial({ color: METAL[t][0], metalness: METAL[t][1], roughness: METAL[t][2] });
// The breaking-wave frames on the disk's outer band. Shown slightly raised so
// they read in the render; in print they'd be flush colour changes.
function waveBand() {
  const g = new THREE.Group(), water = M.navy(), foam = M.cream();
  const slab = (poly, z, h, mat) => { const m = new THREE.Mesh(new THREE.ExtrudeGeometry(new THREE.Shape(poly.map(([x, y]) => new THREE.Vector2(x, y))), { depth: h, bevelEnabled: false }), mat); m.position.z = z; g.add(m); };
  ringArt({ variant: waveVariant, N: waveN, rIn: SP.waveIn, rOut: SP.waveOut }).slots.forEach(sl => {
    sl.water.forEach(p => slab(p, 0, 0.2, water));
    sl.foam.forEach(p => slab(p, 0.2, 0.15, foam));
  });
  return g;
}
// Still front hub: rides the inner race like a cap, stands off far enough to clear the
// spinning face, and carries the text so it stays readable while spinning (and on camera).
function buildHub(tier, standoff, hubR = SP.hubR) {
  const hub = new THREE.Group(), navy = M.navy(), textR = hubR - 4.6, size = hubR > 20 ? 4.6 : 3.2;
  hub.add(zcyl(3.95, -3.3, 3.3, navy, 32));                    // stem into the 8 mm bore
  hub.add(zcyl(SP.spacerR, 0, standoff, navy));                // stand-off lands on the inner race only
  const disc = annulus(hubR, 0, SP.hubT, navy, 0.5); disc.position.z = standoff; hub.add(disc);
  const t1 = arcText('SURFTOBER 2026', textR, size, 0.5, M.tier(tier), true); t1.position.z = standoff + SP.hubT; hub.add(t1);
  const t2 = arcText(NAME.toUpperCase(), textR, size, 0.5, M.tier(tier), false); t2.position.z = standoff + SP.hubT; hub.add(t2);
  if (hubR > 20) { const med = medallion(6.5, 1.2); med.rotation.x = Math.PI / 2; med.position.z = standoff + SP.hubT + 0.6; hub.add(med); }
  return hub;
}
function buildSpinner(tier) {
  const g = new THREE.Group(), parts = [];
  const steel = new THREE.MeshStandardMaterial({ color: 0xd0d4d8, metalness: 0.9, roughness: 0.2 });
  const spin = new THREE.Group(); g.add(spin);                 // everything on the outer race spins…
  const still = new THREE.Group(); g.add(still);               // …inner race, caps, hub and magnet don't

  // 608 bearing: 8 × 22 × 7 — the one part every body option shares
  const outer = annulus(11, 9.6, 7, steel); outer.position.z = -3.5; spin.add(outer);
  const shield = annulus(9.6, 6.2, 6.4, new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.55 })); shield.position.z = -3.2; spin.add(shield);
  const inner = annulus(6.2, 4, 7, steel); inner.position.z = -3.5; still.add(inner);

  // `carrier` holds the spinning front face; artwork sits at faceZ inside it
  let carrier, faceZ;
  if (bodyMode === 'stock') {
    const { shape, P } = spinnerBodyShape();
    const bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: SP.t - 1.2, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.6, bevelOffset: -0.6, bevelSegments: 3, curveSegments: 40 });
    bodyGeo.translate(0, 0, -SP.t / 2 + 0.6);
    const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: 0x5c6168, metalness: 0.85, roughness: 0.33 }));
    body.castShadow = true; body.receiveShadow = true; spin.add(body);
    // Metal weight inserts pressed into the lobes leave only a small through-hole
    const insertMat = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, metalness: 0.9, roughness: 0.28 });
    for (let i = 0; i < 3; i++) { const [x, y] = P(i); const ins = annulus(SP.hole, SP.insertHole, SP.t, insertMat); ins.position.set(x, y, -SP.t / 2); spin.add(ins); }
    // Printed medal ring on the front, full rods through the inserts behind
    carrier = new THREE.Group(); carrier.position.z = SP.t / 2; spin.add(carrier); faceZ = SP.ringT;
    carrier.add(outline(M.tier(tier), SP.ringIn, SP.ringT));
    for (let i = 0; i < 3; i++) { const [x, y] = P(i), rod = zcyl(SP.rodR, -SP.rodLen, SP.rodLen, M.tier(tier), 32); rod.position.x = x; rod.position.y = y; carrier.add(rod); }
    parts.push({ obj: carrier, z0: carrier.position.z, dz: 16 });
  } else if (bodyMode === 'printed') {
    // One printed disc pressed onto the 608. Pause the print at the pocket depth, drop the M6
    // nuts into their hex pockets, resume — they end up sealed in with 1 mm of plastic each side.
    const back = outline(M.tier(tier), 11, SP.t / 2); back.position.z = -SP.t / 2; spin.add(back);
    for (let i = 0; i < SP.nuts; i++) {
      const a = i / SP.nuts * Math.PI * 2, nut = zcyl(SP.nutR, -SP.nutT / 2, SP.nutT, steel, 6);
      nut.position.x = SP.nutOrbit * Math.cos(a); nut.position.y = SP.nutOrbit * Math.sin(a); nut.rotation.y = a; spin.add(nut);
    }
    carrier = new THREE.Group(); spin.add(carrier); faceZ = SP.t / 2;
    carrier.add(outline(M.tier(tier), 11, SP.t / 2));
    parts.push({ obj: carrier, z0: 0, dz: 14 });
  } else if (bodyMode === 'spoked') {

    // out at the rim where the mass does the most good. The still front hub (wideHubR) covers the
    // arms almost entirely, so what shows is the ring, a thin dark reveal, and the text hub.
    carrier = new THREE.Group(); spin.add(carrier); faceZ = SP.t / 2;
    const tierMat = M.tier(tier);
    const hubRing = annulus(SP.spokeHubOut, 11, SP.t, tierMat, 0.4); hubRing.position.z = -SP.t / 2; carrier.add(hubRing);

      const arm = new THREE.Mesh(new THREE.BoxGeometry(len, SP.armW, SP.t), tierMat);

    const hub = annulus(16, 11, SP.t, hubMat, 0.4); hub.position.z = -SP.t / 2; spin.add(hub);
    const flange = annulus(21, 15.9, 1.5, hubMat, 0.3); flange.position.z = SP.t / 2 - SP.discT - 1.5; spin.add(flange);

  if (ringMode === 'wave') art.add(waveBand());

  if (!useHub) {
    const textR = (SP.ringWaist + SP.ringIn) / 2;
    art.add(arcText(`SURFTOBER 2026 · ${TIERS[tier].ring}`, textR, 4.5, SP.textT, M.ink(), true));
    art.add(arcText(NAME.toUpperCase(), textR, 4.5, SP.textT, M.ink(), false));
  }

  const frontFace = carrier.position.z + faceZ + SP.textT;     // highest spinning point on the front
  const front = useHub ? buildHub(tier, frontFace + 0.6 - SP.t / 2, bodyMode === 'spoked' ? SP.wideHubR : SP.hubR) : buildCap(false, parts);
  front.position.z = SP.t / 2; still.add(front);
  const back = buildCap(true, parts); back.rotation.y = Math.PI; back.position.z = -SP.t / 2; still.add(back);
  parts.push({ obj: front, z0: front.position.z, dz: 30 }, { obj: back, z0: back.position.z, dz: -20 });

  // Fridge door, touching the back cap face only
  const fridge = new THREE.Mesh(new THREE.BoxGeometry(170, 150, 2), new THREE.MeshStandardMaterial({ color: 0xc9ccd0, metalness: 0.8, roughness: 0.38 }));
  fridge.position.z = -(SP.t / 2 + SP.spacerT + SP.capT) - 1; fridge.receiveShadow = true; fridge.visible = onFridge; g.add(fridge);

  g.position.y = 50;
  g.userData = { spinner: spin, parts, fridge, explode: exploded ? 1 : 0 };
  return g;
}
const VIEWS = { spinner: { pos: [20, 70, 230], target: [0, 40, 0] } };
const PHONE_VIEW = { pos: [0, 40, 240], target: [0, 40, 0] };   // head-on, for the phone-cam demo
const builders = { spinner: buildSpinner };
let current = null, concept = 'spinner', tier = 'gold';
function rebuild() {
  if (current) scene.remove(current);
  current = builders[concept](tier); scene.add(current);
  const v = phoneCam && concept === 'spinner' ? PHONE_VIEW : VIEWS[concept]; camera.position.set(...v.pos); controls.target.set(...v.target); controls.update();
  document.getElementById('cap').textContent = CAPTIONS[concept] + '  ·  Tier shown: ' + TIERS[tier].label + '  ·  Name: ' + NAME + ' (add ?name=YOURNAME to the URL).';
  document.querySelectorAll('#ui [data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === concept));
  document.getElementById('spinOpts').style.display = concept === 'spinner' ? 'contents' : 'none';
  document.getElementById('armsn').style.display = concept === 'spinner' && bodyMode === 'spoked' ? '' : 'none';
  if (concept === 'spinner' && bodyMode === 'spoked') document.getElementById('cap').textContent += `  ·  Body: one printed piece — wave ring on ${armsN} arms, text on a wide still hub that hides the arms.`;
}
document.querySelectorAll('#ui [data-c]').forEach(b => b.addEventListener('click', () => { concept = b.dataset.c; rebuild(); }));
document.getElementById('tier').addEventListener('change', e => { tier = e.target.value; rebuild(); });
document.getElementById('capc').addEventListener('change', e => { capColor = e.target.value; rebuild(); });
document.getElementById('explode').addEventListener('click', e => { exploded = !exploded; e.target.classList.toggle('on', exploded); });
document.getElementById('fridge').addEventListener('click', e => { onFridge = !onFridge; e.target.classList.toggle('on', onFridge); if (current.userData.fridge) current.userData.fridge.visible = onFridge; });
document.getElementById('bodyspin').addEventListener('click', e => { bodySpin = !bodySpin; e.target.classList.toggle('on', bodySpin); });
document.getElementById('ringm').value = ringMode;
Object.entries(WAVE_VARIANTS).forEach(([k, v]) => document.getElementById('wavev').add(new Option(`Wave: ${v.label}`, k)));
document.getElementById('wavev').value = waveVariant;
document.getElementById('bodym').value = bodyMode;
document.getElementById('bodym').addEventListener('change', e => { bodyMode = e.target.value; rebuild(); });
document.getElementById('armsn').value = String(armsN);
document.getElementById('armsn').addEventListener('change', e => { armsN = +e.target.value; rebuild(); });
document.getElementById('textm').value = textMode;
document.getElementById('textm').addEventListener('change', e => { textMode = e.target.value; rebuild(); });
document.getElementById('wavev').addEventListener('change', e => { waveVariant = e.target.value; waveN = WAVE_VARIANTS[waveVariant].N; if (ringMode !== 'wave') { ringMode = 'wave'; document.getElementById('ringm').value = 'wave'; } rebuild(); });
document.getElementById('ringm').addEventListener('change', e => { ringMode = e.target.value; if (ringMode !== 'wave' && phoneCam) document.getElementById('phonecam').click(); rebuild(); });
// Phone-cam demo: step the ring like a 30 fps video sees it just under sync (0.97 slots per frame)
document.getElementById('phonecam').addEventListener('click', e => {
  phoneCam = !phoneCam; e.target.classList.toggle('on', phoneCam);
  if (!phoneCam) return;
  if (ringMode !== 'wave') { ringMode = 'wave'; document.getElementById('ringm').value = 'wave'; rebuild(); }
  controls.autoRotate = false; document.getElementById('spin').classList.remove('on');
  camera.position.set(...PHONE_VIEW.pos); controls.target.set(...PHONE_VIEW.target); controls.update();
});
document.getElementById('spin').addEventListener('click', e => { controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); });
document.getElementById('png').addEventListener('click', () => { const a = document.createElement('a'); a.download = `surftober-trophy-${concept}-${tier}.png`; a.href = renderer.domElement.toDataURL('image/png'); a.click(); });
window.__trophy = { setConcept: c => { concept = c; rebuild(); }, setTier: t => { tier = t; rebuild(); }, setBody: (b, n) => { bodyMode = b; if (n) { armsN = n; document.getElementById('armsn').value = String(n); } document.getElementById('bodym').value = b; rebuild(); },
  setExploded: v => { exploded = v; }, setBodySpin: v => { bodySpin = v; document.getElementById('bodyspin').classList.toggle('on', v); }, setFridge: v => { onFridge = v; if (current.userData.fridge) current.userData.fridge.visible = v; }, ready: false };

new FontLoader().load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', f => { font = f; rebuild(); window.__trophy.ready = true; });

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
let lastT = performance.now(), camAcc = 0;
(function loop(now) { requestAnimationFrame(loop); const dt = Math.min((now - lastT) / 1000, 0.1); lastT = now; controls.update(); if (current && current.userData.spinner) {

  else if (bodySpin) u.spinner.rotation.z += 0.02;
