<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surftober 2026 — trophy concept mockups</title>
<style>

<body>
<div id="ui">
  <button data-c="plaque" class="on">A · Modular plaque</button>
  <button data-c="fin">B · Fin magnet</button>
  <button data-c="spinner">C · Spinner magnet</button>
  <button data-c="windmill">D · Windmill</button>
  <select id="tier"><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option><option value="participant">Participant</option></select>
  <span id="spinOpts" style="display:none;gap:8px;align-items:center">

  </span>

</div>
<div id="cap"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const NAME = new URLSearchParams(location.search).get('name') || 'NAHLA';
const TIERS = {
  gold:        { color: 0xd4af37, metal: 0.8, rough: 0.3, label: 'Gold (40 h)', ring: 'GOLD' },
  silver:      { color: 0xc8ccd2, metal: 0.85, rough: 0.25,  label: 'Silver (30 h)', ring: 'SILVER' },
  bronze:      { color: 0xb87333, metal: 0.8, rough: 0.35,  label: 'Bronze (20 h)', ring: 'BRONZE' },
  participant: { color: 0x3fa98f, metal: 0.2, rough: 0.6,  label: 'Participant (10 h)', ring: 'PARTICIPANT' },
};
const CAPTIONS = {
  plaque:   'A · Modular plaque — laser-cut (or printed) wood base with the plover logo in relief, a medal-colour trim frame, and a separate name bar that slides into a slot. Bases cut in bulk; one name bar per person.',
  fin:      'B · Fin magnet — a single surfboard fin in the medal colour, name and year raised on the face, magnet disc recessed into the back. Lives on the fridge.',
  spinner:  'C · Spinner magnet — identical stock metal tri-spinner + 608 bearing for all ~50; bare 6061 caps anodized in a Surftober colour, Ø10×2 mm N42 magnet glued flush in the back cap (caps ride the stationary inner race, so the magnet never spins). The lobes carry the usual press-fit metal weight inserts, which leave only a small hole, so the cheap printed medal-colour ring has three full-length rods that pass right through those holes — which is why the ring is wide over the lobes; between the arms its edge curves in so there is still something to flick. It carries SURFTOBER 2026 · tier + name. Only the back cap touches the fridge; rods end 0.2 mm short of the back face. Body/insert dims are placeholders — measure the stock part.',
  windmill: 'D · Windmill — the Ocean Beach Dutch windmill as a layered plaque, sails in the medal colour, name on the sand base.',
};

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3ece2);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 2000);
camera.position.set(140, 110, 190);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 25, 0); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xffffff, 0xcbb9a0, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(120, 200, 140); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -150; key.shadow.camera.right = 150; key.shadow.camera.top = 150; key.shadow.camera.bottom = -150;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffe7d0, 0.6); fill.position.set(-150, 80, -60); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const M = {
  wood:  () => new THREE.MeshStandardMaterial({ color: 0xc9a66b, roughness: 0.85 }),
  wood2: () => new THREE.MeshStandardMaterial({ color: 0xa67c48, roughness: 0.85 }),
  navy:  () => new THREE.MeshStandardMaterial({ color: 0x1d3050, roughness: 0.5 }),
  orange:() => new THREE.MeshStandardMaterial({ color: 0xff6b35, roughness: 0.5 }),
  cream: () => new THREE.MeshStandardMaterial({ color: 0xefe7d2, roughness: 0.7 }),
  teal:  () => new THREE.MeshStandardMaterial({ color: 0x3aa9a3, roughness: 0.6 }),
  sand:  () => new THREE.MeshStandardMaterial({ color: 0xb89b70, roughness: 0.9 }),
  ink:   () => new THREE.MeshStandardMaterial({ color: 0x16273d, roughness: 0.6 }),
  magnet:() => new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.6 }),
  tier:  (t) => new THREE.MeshStandardMaterial({ color: TIERS[t].color, metalness: TIERS[t].metal, roughness: TIERS[t].rough }),
};

let font = null;
function text(str, size, depth, mat, opts = {}) {
  const g = new TextGeometry(str, { font, size, height: depth, curveSegments: 6, bevelEnabled: false });
  g.computeBoundingBox(); const bb = g.getSize ? null : g.boundingBox;
  const w = g.boundingBox.max.x - g.boundingBox.min.x, h = g.boundingBox.max.y - g.boundingBox.min.y;
  g.translate(-w / 2 - g.boundingBox.min.x, -h / 2 - g.boundingBox.min.y, 0);
  const m = new THREE.Mesh(g, mat); m.castShadow = true; return m;
}
function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w/2 + r, -h/2); s.lineTo(w/2 - r, -h/2); s.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r);
  s.lineTo(w/2, h/2 - r); s.quadraticCurveTo(w/2, h/2, w/2 - r, h/2); s.lineTo(-w/2 + r, h/2);
  s.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r); s.lineTo(-w/2, -h/2 + r); s.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);
  return s;
}
function slab(shape, depth, mat, holes) {
  if (holes) holes.forEach(h => shape.holes.push(h));
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false }), mat);
  m.castShadow = true; m.receiveShadow = true; return m;
}
// Flat "logo medallion": navy disc, orange ring, sand dune, teal water, cream bird blob + sun
function medallion(r, depth) {
  const g = new THREE.Group();
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(r, r, depth, 48), M.navy()); disc.castShadow = true; g.add(disc);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r - 1.2, 1.3, 12, 64), M.orange()); ring.rotation.x = Math.PI / 2; ring.position.y = depth / 2; g.add(ring);
  const sun = new THREE.Mesh(new THREE.CylinderGeometry(r * .28, r * .28, 0.8, 32), M.orange()); sun.position.set(r * .22, depth / 2 + .4, -r * .2); g.add(sun);
  const dune = new THREE.Mesh(new THREE.CylinderGeometry(r * .78, r * .78, 0.8, 48, 1, false, Math.PI * 1.15, Math.PI * .7), M.sand()); dune.position.y = depth / 2 + .4; g.add(dune);
  const water = new THREE.Mesh(new THREE.CylinderGeometry(r * .78, r * .78, 0.9, 48, 1, false, Math.PI * 1.3, Math.PI * .4), M.teal()); water.position.y = depth / 2 + .45; g.add(water);
  const bird = new THREE.Mesh(new THREE.SphereGeometry(r * .3, 24, 16), M.cream()); bird.scale.set(1.3, 0.35, 0.8); bird.position.set(-r * .05, depth / 2 + .9, -r * .02); g.add(bird);
  const head = new THREE.Mesh(new THREE.SphereGeometry(r * .15, 20, 14), M.cream()); head.scale.set(1, 0.4, 1); head.position.set(-r * .33, depth / 2 + 1.0, -r * .1); g.add(head);
  return g;
}

function buildPlaque(tier) {
  const g = new THREE.Group();
  const base = slab(roundedRect(120, 90, 8), 6, M.wood()); base.rotation.x = -Math.PI / 2; g.add(base);
  const frame = slab(roundedRect(116, 86, 7), 2, M.tier(tier), [roundedRect(108, 78, 5)]); frame.rotation.x = -Math.PI / 2; frame.position.y = 6; g.add(frame);
  const med = medallion(22, 2.5); med.position.set(0, 6 + 1.25, -8); g.add(med);
  const title = text('SURFTOBER 2026', 6, 1.5, M.ink()); title.rotation.x = -Math.PI / 2; title.position.set(0, 6.2, -36); g.add(title);
  // slot + removable name bar
  const slotBack = slab(roundedRect(84, 18, 3), 1, M.wood2()); slotBack.rotation.x = -Math.PI / 2; slotBack.position.set(0, 5.2, 29); g.add(slotBack);
  const bar = slab(roundedRect(80, 14, 3), 3, M.tier(tier)); bar.rotation.x = -Math.PI / 2; bar.position.set(0, 6.2, 29); g.add(bar);
  const nm = text(NAME, 7, 1.2, M.ink()); nm.rotation.x = -Math.PI / 2; nm.position.set(0, 9.3, 29); g.add(nm);
  const guide = text('name bar slides in from the side  →', 2.6, 0.4, M.wood2()); guide.rotation.x = -Math.PI / 2; guide.position.set(0, 6.1, 40); g.add(guide);
  g.rotation.x = 0.25; g.position.y = 10; // tilted like an easel-back plaque
  return g;
}
function finShape() {
  const s = new THREE.Shape();
  s.moveTo(-28, 0); s.bezierCurveTo(-26, 40, 10, 70, 26, 92); s.bezierCurveTo(22, 60, 30, 30, 34, 0); s.lineTo(-28, 0);
  return s;
}
function buildFin(tier) {
  const g = new THREE.Group();
  const stand = slab(roundedRect(70, 22, 4), 5, M.wood()); stand.rotation.x = -Math.PI / 2; g.add(stand);
  const fin = slab(finShape(), 4, M.tier(tier)); fin.position.set(0, 5, 2); g.add(fin);
  const nm = text(NAME, 6.5, 1.2, M.ink()); nm.rotation.z = 0.9; nm.position.set(-4, 38, 6.3); g.add(nm);
  const yr = text('SURFTOBER 2026', 3.6, 1, M.ink()); yr.rotation.z = 0.9; yr.position.set(5, 30, 6.3); g.add(yr);
  const med = medallion(8, 1.5); med.rotation.x = Math.PI / 2; med.position.set(-10, 16, 6.8); g.add(med);
  const magnet = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 1.5, 32), M.magnet()); magnet.rotation.x = Math.PI / 2; magnet.position.set(0, 24, 1.3); g.add(magnet);
  return g;
}
// ---- C · spinner v2 (stock body + 608 + magnet cap + printed medal ring) ----
// Dimensions in mm. Body numbers are a plausible stock tri-spinner, NOT a
// measured part — measure the real body (lobe-hole Ø especially) before CAD.
const SP = {
  d: 25, R: 13.5, waist: 14.5, hole: 11, t: 7,       // lobe-centre distance, lobe radius, narrowest web, hole radius (Ø22), body thickness
  capR: 9, capT: 3, spacerR: 5.5, spacerT: 0.8,      // Ø18 cap (14–20 range), spacer touches the inner race only
  magR: 5, magT: 2, pocketR: 5.1,                    // Ø10×2 N42 disc, pocket +0.2 on Ø for a glue fit
  insertHole: 4,                                     // lobe weight insert: Ø22 OD press fit, Ø8 through-hole (guess — measure)
  ringOut: 40, ringWaist: 30, ringIn: 17,            // wide printed ring: r 40 over the lobes (covers the rods), dips to r 30 between them as finger notches for flicking
  ringT: 2.4, textT: 0.6,                            // ring thickness, embossed second-colour text
  rodR: 3.85, rodLen: 6.8,                           // Ø7.7 rods, full length through the insert, 0.2 short of the back face
};
const CAP_COLORS = { orange: 0xff6b35, navy: 0x1d3050, teal: 0x3aa9a3 };
let capColor = 'orange', exploded = false, onFridge = false, bodySpin = true;

function zcyl(r, z0, h, mat, seg = 48) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat);
  m.rotation.x = Math.PI / 2; m.position.z = z0 + h / 2; m.castShadow = true; m.receiveShadow = true; return m;
}
// Disc or washer extruded along +z from 0 to depth, with an optional rounded edge.
function annulus(rOut, rIn, depth, mat, bevel = 0) {
  const s = new THREE.Shape(); s.absarc(0, 0, rOut, 0, Math.PI * 2, false);
  if (rIn > 0) { const h = new THREE.Path(); h.absarc(0, 0, rIn, 0, Math.PI * 2, true); s.holes.push(h); }
  const geo = new THREE.ExtrudeGeometry(s, bevel
    ? { depth: depth - 2 * bevel, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelOffset: -bevel, bevelSegments: 2, curveSegments: 64 }
    : { depth, bevelEnabled: false, curveSegments: 64 });
  if (bevel) geo.translate(0, 0, bevel);
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m;
}
// Classic tri-spinner outline: three lobe arcs joined by concave fillets sized so
// the narrowest point between lobes is SP.waist from the centre; four Ø22 holes.
function spinnerBodyShape() {
  const { d, R, waist, hole } = SP;
  const f = (waist * waist + d * d - waist * d - R * R) / (2 * R + d - 2 * waist), q = waist + f;
  const P = i => { const a = Math.PI / 2 + i * 2 * Math.PI / 3; return [d * Math.cos(a), d * Math.sin(a)]; };
  const Q = i => { const a = Math.PI / 2 + i * 2 * Math.PI / 3 + Math.PI / 3; return [q * Math.cos(a), q * Math.sin(a)]; }; // fillet between lobes i and i+1
  const ang = (from, to) => Math.atan2(to[1] - from[1], to[0] - from[0]);
  const s = new THREE.Shape();
  for (let i = 0; i < 3; i++) {
    const p = P(i), pNext = P((i + 1) % 3), qPrev = Q((i + 2) % 3), qNext = Q(i);
    s.absarc(p[0], p[1], R, ang(p, qPrev), ang(p, qNext), false);
    s.absarc(qNext[0], qNext[1], f, ang(qNext, p), ang(qNext, pNext), true);
  }
  [[0, 0], P(0), P(1), P(2)].forEach(([x, y]) => { const h = new THREE.Path(); h.absarc(x, y, hole, 0, Math.PI * 2, true); s.holes.push(h); });
  return { shape: s, P };
}
// Text bent around a circle. top=true reads clockwise over the top, false reads
// counter-clockwise along the bottom; both stay upright.
function arcText(str, r, size, depth, mat, top) {
  const g = new THREE.Group(), scale = size / font.data.resolution, track = size * 0.08, chars = [...str];
  const adv = chars.map(ch => (ch === '·' ? size * 0.7 : font.data.glyphs[ch] ? font.data.glyphs[ch].ha * scale : size * 0.6) + track);
  let s = -(adv.reduce((a, b) => a + b, 0) - track) / 2;
  chars.forEach((ch, i) => {
    const mid = s + adv[i] / 2; s += adv[i];
    if (ch === ' ') return;
    let m;
    if (ch === '·') m = zcyl(size * 0.12, 0, depth, mat, 16);
    else {
      const geo = new TextGeometry(ch, { font, size, height: depth, curveSegments: 4, bevelEnabled: false });
      geo.computeBoundingBox(); geo.translate(-(geo.boundingBox.min.x + geo.boundingBox.max.x) / 2, -size * 0.36, 0);
      m = new THREE.Mesh(geo, mat); m.castShadow = true;
    }
    const th = top ? Math.PI / 2 - mid / r : -Math.PI / 2 + mid / r;
    const w = new THREE.Group(); w.add(m);
    w.position.set(r * Math.cos(th), r * Math.sin(th), 0); w.rotation.z = top ? th - Math.PI / 2 : th + Math.PI / 2;
    g.add(w);
  });
  return g;
}
// Same cap part front and back; the back one gets the magnet pocket. Local +z points away from the body.
function buildCap(withMagnet, parts) {
  const cap = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: CAP_COLORS[capColor], metalness: 0.65, roughness: 0.32 }); // anodized 6061
  cap.add(zcyl(3.95, -3.3, 3.3, mat, 32));                     // stem into the 8 mm bore
  cap.add(zcyl(SP.spacerR, 0, SP.spacerT, mat));               // spacer lands on the stationary inner race
  const disc = annulus(SP.capR, withMagnet ? SP.pocketR : 0, SP.capT, mat, 0.5); disc.position.z = SP.spacerT; cap.add(disc);
  if (withMagnet) {
    const floorT = SP.capT - SP.magT - 0.1;                     // magnet sits 0.1 below the face
    cap.add(zcyl(SP.pocketR, SP.spacerT, floorT, mat));
    const magnet = zcyl(SP.magR, SP.spacerT + floorT, SP.magT, M.magnet()); cap.add(magnet);
    parts.push({ obj: magnet, z0: magnet.position.z, dz: 12 });
  }
  return cap;
}
// Ring outline follows the arms: r = mid + amp·cos(3φ) peaks over each lobe and
// curves in between them, so there's still an edge to flick.
function trefoilRing(tier) {
  const mid = (SP.ringOut + SP.ringWaist) / 2, amp = (SP.ringOut - SP.ringWaist) / 2, N = 240;
  const pts = [];
  for (let i = 0; i < N; i++) { const th = i / N * Math.PI * 2, r = mid + amp * Math.cos(3 * (th - Math.PI / 2)); pts.push(new THREE.Vector2(r * Math.cos(th), r * Math.sin(th))); }
  const s = new THREE.Shape(pts);
  const h = new THREE.Path(); h.absarc(0, 0, SP.ringIn, 0, Math.PI * 2, true); s.holes.push(h);
  const geo = new THREE.ExtrudeGeometry(s, { depth: SP.ringT - 0.8, bevelEnabled: true, bevelThickness: 0.4, bevelSize: 0.4, bevelOffset: -0.4, bevelSegments: 2, curveSegments: 64 });
  geo.translate(0, 0, 0.4);
  const m = new THREE.Mesh(geo, M.tier(tier)); m.castShadow = true; m.receiveShadow = true; return m;
}
function buildSpinner(tier) {
  const g = new THREE.Group(), parts = [];
  const steel = new THREE.MeshStandardMaterial({ color: 0xd0d4d8, metalness: 0.9, roughness: 0.2 });
  const spin = new THREE.Group(); g.add(spin);                 // everything on the outer race spins…
  const still = new THREE.Group(); g.add(still);               // …inner race, caps and magnet don't

  const { shape, P } = spinnerBodyShape();
  const bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: SP.t - 1.2, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.6, bevelOffset: -0.6, bevelSegments: 3, curveSegments: 40 });
  bodyGeo.translate(0, 0, -SP.t / 2 + 0.6);
  const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: 0x5c6168, metalness: 0.85, roughness: 0.33 }));
  body.castShadow = true; body.receiveShadow = true; spin.add(body);

  // 608 bearing: 8 × 22 × 7
  const outer = annulus(11, 9.6, 7, steel); outer.position.z = -3.5; spin.add(outer);
  const shield = annulus(9.6, 6.2, 6.4, new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.55 })); shield.position.z = -3.2; spin.add(shield);
  const inner = annulus(6.2, 4, 7, steel); inner.position.z = -3.5; still.add(inner);

  // Metal weight inserts pressed into the lobes leave only a small through-hole
  const insertMat = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, metalness: 0.9, roughness: 0.28 });
  for (let i = 0; i < 3; i++) { const [x, y] = P(i); const ins = annulus(SP.hole, SP.insertHole, SP.t, insertMat); ins.position.set(x, y, -SP.t / 2); spin.add(ins); }

  // Printed medal ring: band + embossed text on the front, full rods through the inserts behind
  const ring = new THREE.Group(); ring.position.z = SP.t / 2; spin.add(ring);
  ring.add(trefoilRing(tier));
  for (let i = 0; i < 3; i++) {
    const [x, y] = P(i), rod = zcyl(SP.rodR, -SP.rodLen, SP.rodLen, M.tier(tier), 32);
    rod.position.x = x; rod.position.y = y; ring.add(rod);
  }
  const textR = (SP.ringWaist + SP.ringIn) / 2;      // text lives in the band that survives the notches
  const top = arcText(`SURFTOBER 2026 · ${TIERS[tier].ring}`, textR, 4.5, SP.textT, M.ink(), true); top.position.z = SP.ringT; ring.add(top);
  const nm = arcText(NAME.toUpperCase(), textR, 4.5, SP.textT, M.ink(), false); nm.position.z = SP.ringT; ring.add(nm);
  parts.push({ obj: ring, z0: ring.position.z, dz: 16 });

  const front = buildCap(false, parts); front.position.z = SP.t / 2; still.add(front);
  const back = buildCap(true, parts); back.rotation.y = Math.PI; back.position.z = -SP.t / 2; still.add(back);
  parts.push({ obj: front, z0: front.position.z, dz: 30 }, { obj: back, z0: back.position.z, dz: -20 });

  // Fridge door, touching the back cap face only
  const fridge = new THREE.Mesh(new THREE.BoxGeometry(170, 150, 2), new THREE.MeshStandardMaterial({ color: 0xc9ccd0, metalness: 0.8, roughness: 0.38 }));
  fridge.position.z = -(SP.t / 2 + SP.spacerT + SP.capT) - 1; fridge.receiveShadow = true; fridge.visible = onFridge; g.add(fridge);

  g.position.y = 50;
  g.userData = { spinner: spin, parts, fridge, explode: exploded ? 1 : 0 };
  return g;
}
function buildWindmill(tier) {
  const g = new THREE.Group();
  const base = slab(roundedRect(100, 120, 8), 5, M.wood()); base.position.set(0, 0, -5); g.add(base);
  const sky = slab(roundedRect(92, 112, 6), 1.5, M.navy()); sky.position.set(0, 0, 0); g.add(sky);
  const sunD = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, 1.2, 40), M.orange()); sunD.rotation.x = Math.PI / 2; sunD.position.set(26, 30, 2.2); g.add(sunD);
  const duneShape = new THREE.Shape(); duneShape.moveTo(-46, -56); duneShape.quadraticCurveTo(0, -24, 46, -56); duneShape.lineTo(46, -56); duneShape.closePath();
  const dune = slab(duneShape, 1.6, M.sand()); dune.position.set(0, 0, 1.5); g.add(dune);
  // windmill: tower + cap + four sails
  const tower = slab(new THREE.Shape([new THREE.Vector2(-11, -36), new THREE.Vector2(11, -36), new THREE.Vector2(6, 4), new THREE.Vector2(-6, 4)]), 2.5, M.wood2()); tower.position.set(-14, 0, 2.3); g.add(tower);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(9, 10, 24), M.ink()); cap.position.set(-14, 9, 3.5); g.add(cap);
  for (let i = 0; i < 4; i++) {
    const sail = new THREE.Mesh(new THREE.BoxGeometry(3, 26, 2), M.tier(tier)); sail.position.set(-14, 6, 5.5); sail.rotation.z = i * Math.PI / 2 + 0.4;
    sail.geometry.translate(0, 13, 0); sail.castShadow = true; g.add(sail);
  }
  const title = text('SURFTOBER 2026', 5, 1.2, M.cream()); title.position.set(0, 44, 2.6); g.add(title);
  const nm = text(NAME, 6.5, 1.5, M.ink()); nm.position.set(0, -44, 3.5); g.add(nm);
  g.position.set(0, 62, 0);
  return g;
}

const VIEWS = { plaque: { pos: [140, 110, 190], target: [0, 15, 0] }, fin: { pos: [40, 70, 230], target: [0, 45, 0] },
                spinner: { pos: [80, 85, 190], target: [0, 50, 0] }, windmill: { pos: [30, 90, 310], target: [0, 62, 0] } };
const builders = { plaque: buildPlaque, fin: buildFin, spinner: buildSpinner, windmill: buildWindmill };
let current = null, concept = 'plaque', tier = 'gold';
function rebuild() {
  if (current) scene.remove(current);
  current = builders[concept](tier); scene.add(current);
  const v = VIEWS[concept]; camera.position.set(...v.pos); controls.target.set(...v.target); controls.update();
  document.getElementById('cap').textContent = CAPTIONS[concept] + '  ·  Tier shown: ' + TIERS[tier].label + '  ·  Name: ' + NAME + ' (add ?name=YOURNAME to the URL).';
  document.querySelectorAll('#ui [data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === concept));
  document.getElementById('spinOpts').style.display = concept === 'spinner' ? 'flex' : 'none';
}
document.querySelectorAll('#ui [data-c]').forEach(b => b.addEventListener('click', () => { concept = b.dataset.c; rebuild(); }));
document.getElementById('tier').addEventListener('change', e => { tier = e.target.value; rebuild(); });
document.getElementById('capc').addEventListener('change', e => { capColor = e.target.value; rebuild(); });
document.getElementById('explode').addEventListener('click', e => { exploded = !exploded; e.target.classList.toggle('on', exploded); });
document.getElementById('fridge').addEventListener('click', e => { onFridge = !onFridge; e.target.classList.toggle('on', onFridge); if (current.userData.fridge) current.userData.fridge.visible = onFridge; });
document.getElementById('bodyspin').addEventListener('click', e => { bodySpin = !bodySpin; e.target.classList.toggle('on', bodySpin); });
document.getElementById('spin').addEventListener('click', e => { controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); });
document.getElementById('png').addEventListener('click', () => { const a = document.createElement('a'); a.download = `surftober-trophy-${concept}-${tier}.png`; a.href = renderer.domElement.toDataURL('image/png'); a.click(); });
window.__trophy = { setConcept: c => { concept = c; rebuild(); }, setTier: t => { tier = t; rebuild(); },
  setExploded: v => { exploded = v; }, setBodySpin: v => { bodySpin = v; document.getElementById('bodyspin').classList.toggle('on', v); }, setFridge: v => { onFridge = v; if (current.userData.fridge) current.userData.fridge.visible = v; }, ready: false };

new FontLoader().load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', f => { font = f; rebuild(); window.__trophy.ready = true; });

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop() { requestAnimationFrame(loop); controls.update(); if (current && current.userData.spinner) {
  const u = current.userData; if (bodySpin) u.spinner.rotation.z += 0.02;
  u.explode += ((exploded ? 1 : 0) - u.explode) * 0.08;
  u.parts.forEach(p => { p.obj.position.z = p.z0 + p.dz * u.explode; });
}
renderer.render(scene, camera); })();
</script>
