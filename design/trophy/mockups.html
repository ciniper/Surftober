<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surftober 2026 — trophy concept mockups</title>
<style>
  html,body{margin:0;height:100%;background:#f3ece2;font-family:system-ui,-apple-system,sans-serif;color:#2d2416}
  #ui{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}
  button,select{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid #d4c4a8;background:#fff8f0;cursor:pointer}
  button.on{background:#d1470f;color:#fff;border-color:#d1470f}
  #cap{position:fixed;left:10px;bottom:10px;right:10px;font-size:13px;color:#6f5d46;background:rgba(255,248,240,.85);padding:8px 10px;border-radius:8px}
  canvas{display:block}
</style>
</head>
<body>
<div id="ui">
  <button data-c="plaque" class="on">A · Modular plaque</button>
  <button data-c="fin">B · Fin magnet</button>
  <button data-c="spinner">C · Spinner magnet</button>
  <button data-c="windmill">D · Windmill</button>
  <select id="tier"><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option><option value="participant">Participant</option></select>
  <button id="spin" class="on">Auto-rotate</button>
  <button id="png">Download PNG</button>
</div>
<div id="cap"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const NAME = new URLSearchParams(location.search).get('name') || 'NAHLA';
const TIERS = {
  gold:        { color: 0xd4af37, metal: 0.8, rough: 0.3, label: 'Gold (40 h)' },
  silver:      { color: 0xc8ccd2, metal: 0.85, rough: 0.25,  label: 'Silver (30 h)' },
  bronze:      { color: 0xb87333, metal: 0.8, rough: 0.35,  label: 'Bronze (20 h)' },
  participant: { color: 0x3fa98f, metal: 0.2, rough: 0.6,  label: 'Participant (10 h)' },
};
const CAPTIONS = {
  plaque:   'A · Modular plaque — laser-cut (or printed) wood base with the plover logo in relief, a medal-colour trim frame, and a separate name bar that slides into a slot. Bases cut in bulk; one name bar per person.',
  fin:      'B · Fin magnet — a single surfboard fin in the medal colour, name and year raised on the face, magnet disc recessed into the back. Lives on the fridge.',
  spinner:  'C · Spinner magnet — tri-lobe fidget spinner, logo in the hub, name on one lobe, magnet core on the back so it parks on the fridge.',
  windmill: 'D · Windmill — the Ocean Beach Dutch windmill as a layered plaque, sails in the medal colour, name on the sand base.',
};

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3ece2);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 1, 2000);
camera.position.set(140, 110, 190);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 25, 0); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xffffff, 0xcbb9a0, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(120, 200, 140); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -150; key.shadow.camera.right = 150; key.shadow.camera.top = 150; key.shadow.camera.bottom = -150;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffe7d0, 0.6); fill.position.set(-150, 80, -60); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const M = {
  wood:  () => new THREE.MeshStandardMaterial({ color: 0xc9a66b, roughness: 0.85 }),
  wood2: () => new THREE.MeshStandardMaterial({ color: 0xa67c48, roughness: 0.85 }),
  navy:  () => new THREE.MeshStandardMaterial({ color: 0x1d3050, roughness: 0.5 }),
  orange:() => new THREE.MeshStandardMaterial({ color: 0xff6b35, roughness: 0.5 }),
  cream: () => new THREE.MeshStandardMaterial({ color: 0xefe7d2, roughness: 0.7 }),
  teal:  () => new THREE.MeshStandardMaterial({ color: 0x3aa9a3, roughness: 0.6 }),
  sand:  () => new THREE.MeshStandardMaterial({ color: 0xb89b70, roughness: 0.9 }),
  ink:   () => new THREE.MeshStandardMaterial({ color: 0x16273d, roughness: 0.6 }),
  magnet:() => new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.6 }),
  tier:  (t) => new THREE.MeshStandardMaterial({ color: TIERS[t].color, metalness: TIERS[t].metal, roughness: TIERS[t].rough }),
};

let font = null;
function text(str, size, depth, mat, opts = {}) {
  const g = new TextGeometry(str, { font, size, height: depth, curveSegments: 6, bevelEnabled: false });
  g.computeBoundingBox(); const bb = g.getSize ? null : g.boundingBox;
  const w = g.boundingBox.max.x - g.boundingBox.min.x, h = g.boundingBox.max.y - g.boundingBox.min.y;
  g.translate(-w / 2 - g.boundingBox.min.x, -h / 2 - g.boundingBox.min.y, 0);
  const m = new THREE.Mesh(g, mat); m.castShadow = true; return m;
}
function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w/2 + r, -h/2); s.lineTo(w/2 - r, -h/2); s.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r);
  s.lineTo(w/2, h/2 - r); s.quadraticCurveTo(w/2, h/2, w/2 - r, h/2); s.lineTo(-w/2 + r, h/2);
  s.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r); s.lineTo(-w/2, -h/2 + r); s.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);
  return s;
}
function slab(shape, depth, mat, holes) {
  if (holes) holes.forEach(h => shape.holes.push(h));
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false }), mat);
  m.castShadow = true; m.receiveShadow = true; return m;
}
// Flat "logo medallion": navy disc, orange ring, sand dune, teal water, cream bird blob + sun
function medallion(r, depth) {
  const g = new THREE.Group();
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(r, r, depth, 48), M.navy()); disc.castShadow = true; g.add(disc);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r - 1.2, 1.3, 12, 64), M.orange()); ring.rotation.x = Math.PI / 2; ring.position.y = depth / 2; g.add(ring);
  const sun = new THREE.Mesh(new THREE.CylinderGeometry(r * .28, r * .28, 0.8, 32), M.orange()); sun.position.set(r * .22, depth / 2 + .4, -r * .2); g.add(sun);
  const dune = new THREE.Mesh(new THREE.CylinderGeometry(r * .78, r * .78, 0.8, 48, 1, false, Math.PI * 1.15, Math.PI * .7), M.sand()); dune.position.y = depth / 2 + .4; g.add(dune);
  const water = new THREE.Mesh(new THREE.CylinderGeometry(r * .78, r * .78, 0.9, 48, 1, false, Math.PI * 1.3, Math.PI * .4), M.teal()); water.position.y = depth / 2 + .45; g.add(water);
  const bird = new THREE.Mesh(new THREE.SphereGeometry(r * .3, 24, 16), M.cream()); bird.scale.set(1.3, 0.35, 0.8); bird.position.set(-r * .05, depth / 2 + .9, -r * .02); g.add(bird);
  const head = new THREE.Mesh(new THREE.SphereGeometry(r * .15, 20, 14), M.cream()); head.scale.set(1, 0.4, 1); head.position.set(-r * .33, depth / 2 + 1.0, -r * .1); g.add(head);
  return g;
}

function buildPlaque(tier) {
  const g = new THREE.Group();
  const base = slab(roundedRect(120, 90, 8), 6, M.wood()); base.rotation.x = -Math.PI / 2; g.add(base);
  const frame = slab(roundedRect(116, 86, 7), 2, M.tier(tier), [roundedRect(108, 78, 5)]); frame.rotation.x = -Math.PI / 2; frame.position.y = 6; g.add(frame);
  const med = medallion(22, 2.5); med.position.set(0, 6 + 1.25, -8); g.add(med);
  const title = text('SURFTOBER 2026', 6, 1.5, M.ink()); title.rotation.x = -Math.PI / 2; title.position.set(0, 6.2, -36); g.add(title);
  // slot + removable name bar
  const slotBack = slab(roundedRect(84, 18, 3), 1, M.wood2()); slotBack.rotation.x = -Math.PI / 2; slotBack.position.set(0, 5.2, 29); g.add(slotBack);
  const bar = slab(roundedRect(80, 14, 3), 3, M.tier(tier)); bar.rotation.x = -Math.PI / 2; bar.position.set(0, 6.2, 29); g.add(bar);
  const nm = text(NAME, 7, 1.2, M.ink()); nm.rotation.x = -Math.PI / 2; nm.position.set(0, 9.3, 29); g.add(nm);
  const guide = text('name bar slides in from the side  →', 2.6, 0.4, M.wood2()); guide.rotation.x = -Math.PI / 2; guide.position.set(0, 6.1, 40); g.add(guide);
  g.rotation.x = 0.25; g.position.y = 10; // tilted like an easel-back plaque
  return g;
}
function finShape() {
  const s = new THREE.Shape();
  s.moveTo(-28, 0); s.bezierCurveTo(-26, 40, 10, 70, 26, 92); s.bezierCurveTo(22, 60, 30, 30, 34, 0); s.lineTo(-28, 0);
  return s;
}
function buildFin(tier) {
  const g = new THREE.Group();
  const stand = slab(roundedRect(70, 22, 4), 5, M.wood()); stand.rotation.x = -Math.PI / 2; g.add(stand);
  const fin = slab(finShape(), 4, M.tier(tier)); fin.position.set(0, 5, 2); g.add(fin);
  const nm = text(NAME, 6.5, 1.2, M.ink()); nm.rotation.z = 0.9; nm.position.set(-4, 38, 6.3); g.add(nm);
  const yr = text('SURFTOBER 2026', 3.6, 1, M.ink()); yr.rotation.z = 0.9; yr.position.set(5, 30, 6.3); g.add(yr);
  const med = medallion(8, 1.5); med.rotation.x = Math.PI / 2; med.position.set(-10, 16, 6.8); g.add(med);
  const magnet = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 1.5, 32), M.magnet()); magnet.rotation.x = Math.PI / 2; magnet.position.set(0, 24, 1.3); g.add(magnet);
  return g;
}
function buildSpinner(tier) {
  const g = new THREE.Group();
  const stand = slab(roundedRect(60, 20, 4), 5, M.wood()); stand.rotation.x = -Math.PI / 2; g.add(stand);
  const body = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const a = i * 2 * Math.PI / 3 + Math.PI / 2;
    const lobe = new THREE.Mesh(new THREE.CylinderGeometry(15, 15, 6, 48), M.tier(tier)); lobe.rotation.x = Math.PI / 2; lobe.position.set(Math.cos(a) * 24, Math.sin(a) * 24, 0); lobe.castShadow = true; body.add(lobe);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(24, 18, 6), M.tier(tier)); arm.position.set(Math.cos(a) * 12, Math.sin(a) * 12, 0); arm.rotation.z = a; arm.castShadow = true; body.add(arm);
    const bearing = new THREE.Mesh(new THREE.TorusGeometry(8.5, 1.6, 10, 40), M.magnet()); bearing.position.set(Math.cos(a) * 24, Math.sin(a) * 24, 3.2); body.add(bearing);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(17, 17, 6.5, 48), M.tier(tier)); hub.rotation.x = Math.PI / 2; body.add(hub);
  const med = medallion(13, 2); med.rotation.x = Math.PI / 2; med.position.set(0, 0, 4.3); body.add(med);
  const nm = text(NAME, 4.2, 1, M.ink()); nm.position.set(Math.cos(Math.PI / 2 + 2 * Math.PI / 3) * 24, Math.sin(Math.PI / 2 + 2 * Math.PI / 3) * 24, 3.2); body.add(nm);
  const yr = text('2026', 4.2, 1, M.ink()); yr.position.set(Math.cos(Math.PI / 2 + 4 * Math.PI / 3) * 24, Math.sin(Math.PI / 2 + 4 * Math.PI / 3) * 24, 3.2); body.add(yr);
  const magnet = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 1.5, 32), M.magnet()); magnet.rotation.x = Math.PI / 2; magnet.position.set(0, 0, -3.9); body.add(magnet);
  body.position.set(0, 44, 3); g.add(body);
  g.userData.spinner = body;
  return g;
}
function buildWindmill(tier) {
  const g = new THREE.Group();
  const base = slab(roundedRect(100, 120, 8), 5, M.wood()); base.position.set(0, 0, -5); g.add(base);
  const sky = slab(roundedRect(92, 112, 6), 1.5, M.navy()); sky.position.set(0, 0, 0); g.add(sky);
  const sunD = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, 1.2, 40), M.orange()); sunD.rotation.x = Math.PI / 2; sunD.position.set(26, 30, 2.2); g.add(sunD);
  const duneShape = new THREE.Shape(); duneShape.moveTo(-46, -56); duneShape.quadraticCurveTo(0, -24, 46, -56); duneShape.lineTo(46, -56); duneShape.closePath();
  const dune = slab(duneShape, 1.6, M.sand()); dune.position.set(0, 0, 1.5); g.add(dune);
  // windmill: tower + cap + four sails
  const tower = slab(new THREE.Shape([new THREE.Vector2(-11, -36), new THREE.Vector2(11, -36), new THREE.Vector2(6, 4), new THREE.Vector2(-6, 4)]), 2.5, M.wood2()); tower.position.set(-14, 0, 2.3); g.add(tower);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(9, 10, 24), M.ink()); cap.position.set(-14, 9, 3.5); g.add(cap);
  for (let i = 0; i < 4; i++) {
    const sail = new THREE.Mesh(new THREE.BoxGeometry(3, 26, 2), M.tier(tier)); sail.position.set(-14, 6, 5.5); sail.rotation.z = i * Math.PI / 2 + 0.4;
    sail.geometry.translate(0, 13, 0); sail.castShadow = true; g.add(sail);
  }
  const title = text('SURFTOBER 2026', 5, 1.2, M.cream()); title.position.set(0, 44, 2.6); g.add(title);
  const nm = text(NAME, 6.5, 1.5, M.ink()); nm.position.set(0, -44, 3.5); g.add(nm);
  g.position.set(0, 62, 0);
  return g;
}

const VIEWS = { plaque: { pos: [140, 110, 190], target: [0, 15, 0] }, fin: { pos: [40, 70, 230], target: [0, 45, 0] },
                spinner: { pos: [20, 70, 230], target: [0, 40, 0] }, windmill: { pos: [30, 90, 310], target: [0, 62, 0] } };
const builders = { plaque: buildPlaque, fin: buildFin, spinner: buildSpinner, windmill: buildWindmill };
let current = null, concept = 'plaque', tier = 'gold';
function rebuild() {
  if (current) scene.remove(current);
  current = builders[concept](tier); scene.add(current);
  const v = VIEWS[concept]; camera.position.set(...v.pos); controls.target.set(...v.target); controls.update();
  document.getElementById('cap').textContent = CAPTIONS[concept] + '  ·  Tier shown: ' + TIERS[tier].label + '  ·  Name: ' + NAME + ' (add ?name=YOURNAME to the URL).';
  document.querySelectorAll('#ui [data-c]').forEach(b => b.classList.toggle('on', b.dataset.c === concept));
}
document.querySelectorAll('#ui [data-c]').forEach(b => b.addEventListener('click', () => { concept = b.dataset.c; rebuild(); }));
document.getElementById('tier').addEventListener('change', e => { tier = e.target.value; rebuild(); });
document.getElementById('spin').addEventListener('click', e => { controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); });
document.getElementById('png').addEventListener('click', () => { const a = document.createElement('a'); a.download = `surftober-trophy-${concept}-${tier}.png`; a.href = renderer.domElement.toDataURL('image/png'); a.click(); });
window.__trophy = { setConcept: c => { concept = c; rebuild(); }, setTier: t => { tier = t; rebuild(); }, ready: false };

new FontLoader().load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', f => { font = f; rebuild(); window.__trophy.ready = true; });

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop() { requestAnimationFrame(loop); controls.update(); if (current && current.userData.spinner) current.userData.spinner.rotation.z += 0.01; renderer.render(scene, camera); })();
</script>
</body>
</html>
